<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regis Sprint Timings</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body data-page="overall">
  
  <header id="site-header"></header>

  <div id="historicalHeader" class="historical-header desktop-only mobile-only"></div>

  <main>
    <div id="leaderboard-wrapper">

      <div class="overall-leaderboard-header row overall-row">
        <div class="header-spacer"></div> <!-- optional: can remove later -->
        <div>Pos</div>
        <div>No</div>
        <div class="hide-mobile">Class</div>
        <div class="driver-header">Driver</div>
        <div class="hide-mobile car-header">Car</div>
        <div>Best</div>
        <div class="gap gap-stack">
          <span>Gap</span>
          <span class="gap-front">+/-</span>
        </div>
      </div>

      <div id="leaderboard"></div>

    </div>
  </main>

  <button id="scrollToTop" class="scroll-top-btn" aria-label="Return to top">
    ↑ Top
  </button>

  <script src="js/header.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
