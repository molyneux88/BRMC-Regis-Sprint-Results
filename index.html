<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Lap Times</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>Overall Leaderboard</h1>

    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="autoScrollToggle" unchecked />
        <span class="slider"></span>
        <span class="label-text">Auto Scroll</span>
      </label>
      <br>
      <div id="lastUpdated">Waiting for data…</div>
    </div>
  </header>

  <main>
    <div class="overall-leaderboard-header row overall-row">
        <div></div>
        <div>Pos</div>
        <div>No</div>
        <div>Class</div>
        <div>Driver</div>
        <div>Car</div>
        <div>Best</div>
        <div class="gap gap-stack">
        <span>Gap</span>
        <span class="gap-front">+/-</span>
    </div>
    </div>


    <div id="leaderboard-wrapper">
        <div id="leaderboard"></div>
    </div>
  </main>


  <script src="app.js"></script>
</body>
</html>
