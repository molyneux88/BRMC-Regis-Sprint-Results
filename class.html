<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Class Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header centered-layout">

    <!-- LEFT: reserved for future nav / page title -->
    <div class="header-left">
      <div class="page-title">Class Leaderboard</div>
    </div>

    <!-- CENTER: event branding -->
    <div class="header-center">
      <img src="BRMC Logo.avif" alt="BRMC Crest" class="header-logo large">
      <h1>2026 Regis Sprint at Goodwood</h1>
    </div>

    <!-- RIGHT: controls / status -->
    <div class="header-right">
      

      <div id="lastUpdated">Waiting for data…</div>
    </div>

  </header>

<!-- Prominent class selector -->
<div class="class-selector">
  Select Class:
  <select id="classSelect">
    <option value="">— Choose Class —</option>
  </select>
</div>

<main>
  <div class="leaderboard-header-class row class-row">
    <div></div>
    <div>Class Pos</div>
    <div>Overall</div>
    <div>No</div>
    <div>Driver</div>
    <div>Car</div>

    <div class="run-time">P</div>
    <div class="run-time">R1</div>
    <div class="run-time">R2</div>
    <div class="run-time">R3</div>
    <div class="sparklineText">Spark</div>

    <div>Best</div>
    <div class="gap gap-stack">
      <span>Gap</span>
      <span class="gap-front">±</span>
    </div>
  </div>

  <div id="leaderboard-wrapper">
    <div id="leaderboard"></div>
  </div>
</main>

<script src="class.js"></script>
</body>
</html>
