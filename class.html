<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Results</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body data-page="class">

<header id="site-header"></header>

  <!-- Mobile last-updated -->
  <div id="lastUpdatedMobile" class="last-updated-mobile">
    Waiting for data…
  </div> 


<!-- Prominent class selector -->
<div class="class-selector">
  Select Class:
  <select id="classSelect">
    <option value="">— Choose Class —</option>
  </select>
</div>

<main>
  <div class="leaderboard-header-class row class-row">
    <div class="hide-mobile"></div>
    <div class="hide-mobile">Class<br>Pos</div>
    <div class="gap-stack position-combined hide-desktop">
      <span class="class-pos">Pos</span>
      <span class="class-pos">C<span class="pos-sep"> / </span><span class="overall-pos">O</span></span>
    </div>
    <div class="hide-mobile">Overall<br>Pos</div>
    <div>No</div>
    <div>Driver</div>
    <div class="hide-mobile">Car</div>

    <div class="run-time hide-mobile">P</div>
    <div class="run-time hide-mobile">R1</div>
    <div class="run-time hide-mobile">R2</div>
    <div class="run-time hide-mobile">R3</div>
    <div class="sparklineText hide-mobile">Spark</div>

    <div>Best</div>
    <div class="gap gap-stack">
      <span>Gap</span>
      <span class="gap-front">±</span>
    </div>
  </div>

  <div id="leaderboard-wrapper">
    <div id="leaderboard"></div>
  </div>
</main>

<script src="js/header.js"></script>
<script src="js/class.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
