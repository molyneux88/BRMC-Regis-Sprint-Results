<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="class">

<header id="site-header"></header>

  <!-- Mobile last-updated -->
  <div id="lastUpdatedMobile" class="last-updated-mobile">
    Waiting for data…
  </div> 


<!-- Prominent class selector -->
<div class="class-selector">
  Select Class:
  <select id="classSelect">
    <option value="">— Choose Class —</option>
  </select>
</div>

<main>
  <div class="leaderboard-header-class row class-row">
    <div></div>
    <div>Class Pos</div>
    <div>Overall</div>
    <div>No</div>
    <div>Driver</div>
    <div>Car</div>

    <div class="run-time">P</div>
    <div class="run-time">R1</div>
    <div class="run-time">R2</div>
    <div class="run-time">R3</div>
    <div class="sparklineText">Spark</div>

    <div>Best</div>
    <div class="gap gap-stack">
      <span>Gap</span>
      <span class="gap-front">±</span>
    </div>
  </div>

  <div id="leaderboard-wrapper">
    <div id="leaderboard"></div>
  </div>
</main>

<script src="header.js"></script>
<script src="class.js"></script>
<script src="nav.js"></script>
</body>
</html>
